[package]
name = "irminsul"
version = "0.2.1-T-1"
authors = ["Konkers <konkers@konkers.net>"]
edition = "2024"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
# The source uses let-chains (e.g. `src/app.rs`, `src/wish.rs`), stable since
# 1.88, so anything lower will not compile.
rust-version = "1.88"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

# `build.rs` writes the game data blob that `src/monitor.rs` embeds, so these
# three crates are used by both the build script and the binary and must not
# drift apart: flate2 in particular writes the gz on one side and reads it on
# the other. Declaring them once here and inheriting with `workspace = true`
# makes that impossible to get wrong.
[workspace]

[workspace.dependencies]
anime-game-data = { git = "https://github.com/konkers/anime-game-data", rev = "dfc03cdb5e27807a876b8d4dff17b3f67a320f5c" }
flate2 = "1.1.9"
tokio = { version = "1.47.1", features = [
	"rt",
	"tokio-macros",
	"macros",
	"rt-multi-thread",
] }

[dependencies]
# Shared with [build-dependencies]; see [workspace.dependencies] above.
anime-game-data = { workspace = true }
flate2 = { workspace = true }
tokio = { workspace = true }

anyhow = "1.0.99"
async-trait = "0.1.89"
async-watcher = "0.3.0"
auto-artifactarium = { git = "https://github.com/tawan475/auto-artifactarium", rev = "01a48e8673dabaccbe6fe4f13f1c98b246491801" }
base64 = "0.22.1"
chrono = "0.4.42"
clap = { version = "4.5.47", features = ["derive"] }
ctrlc = "3.4.7"
eframe = { version = "0.32", default-features = false, features = [
	"accesskit",     # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
	"default_fonts", # Embed the default egui fonts.
	"glow",          # Use the glow rendering backend. Alternative: "wgpu".
	"persistence",   # Enable restoring app state when restarting the app.
	"wayland",       # To support Linux (and CI)
	"x11",           # To support older Linux distributions (restores one of the default features)
] }
egui = "0.32"
egui-file-dialog = "0.11.0"
egui-notify = "0.20.0"
egui_extras = { version = "0.32.2", features = ["image", "svg", "webp"] }
egui_material_icons = "0.4.0"
futures = "0.3.31"
futures-util = "0.3.31"
indexmap = "2.11.1"
log = "0.4.27"
# NOTE: `notify` is used only through `async-watcher`'s re-export
# (`async_watcher::notify::…`), so it is deliberately not a direct dependency:
# a direct entry here would pull in a second, independently versioned copy.
open = "5.3.2"
regex = "1.11.2"
reqwest = { version = "0.12.23", features = ["gzip", "stream", "multipart"] }
# `compression-flate2` (which pulls in `archive-tar`) is what lets the Linux
# release tarball be unpacked before `self_replace` installs the binary
# inside it. Without it `src/update.rs` can only refuse the asset, which
# leaves Linux with no in-app update path at all.
self_update = { version = "0.42.0", features = ["compression-flate2"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["alloc"] }
# Only the `system` feature, and only for a process-name scan (see
# `src/game_watch.rs`). This is not really a new dependency: `egui-file-dialog`
# already pulls the same 0.36 line in with `default-features = false,
# features = ["disk"]`, so this is a feature union on a crate that was already
# being compiled -- no new version in the tree, and none of `component`,
# `network` or `user`.
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tempfile = "3.21.0"
tokio-util = "0.7.16"
tracing = { version = "0.1.41" }
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tray-icon = { version = "0.24.1", default-features = false, features = [ "gtk" ] }
image = "0.25.9"
single-instance = "0.3.3"

[target.'cfg(windows)'.dependencies]
pktmon = { version = "0.6.2", features = ["tokio"] }
# On Windows pcap is optional (needs the Npcap SDK); pktmon is the default backend.
pcap = { version = "2.3.0", features = ["capture-stream"], optional = true }
windows = { version = "0.61.3", features = [
	"Win32_System_Console",
	"Win32_System_Registry",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

# On every non-Windows platform pcap is the only capture backend, so it is a
# mandatory dependency and always compiled in.
[target.'cfg(not(windows))'.dependencies]
pcap = { version = "2.3.0", features = ["capture-stream"] }

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5.6"
gtk = "0.18.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[dev-dependencies]
# Builds the fixture tarball that `src/update.rs` unpacks. Already in the
# graph through self_update's `archive-tar`; named here so the tests can
# construct one.
tar = "0.4"

[build-dependencies]
# Shared with [dependencies]; see [workspace.dependencies] above.
anime-game-data = { workspace = true }
flate2 = { workspace = true }
tokio = { workspace = true }

winresource = "0.1.23"

[features]
# `pcap` is intentionally NOT enabled by default: it requires the Npcap SDK
# (wpcap.lib) to build and wpcap.dll at runtime on Windows. Windows uses the
# pktmon backend by default, so enable `pcap` explicitly if you need it
# (e.g. `cargo build --features pcap`).
default = []
pcap = ["dep:pcap"]
static-libpcap = ["pcap"]

[profile.release]
# Inherited from the upstream eframe template, where the comment referred to
# wasm builds irminsul does not produce. Kept at 2 because nothing has measured
# a benefit from 3 for this workload.
opt-level = 2

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2

# Uncomment for local debugging
# [patch."https://github.com/konkers/anime-game-data"]
# anime-game-data = { path = "../anime-game-data" }

# Uncomment for local debugging
# [patch."https://github.com/tawan475/auto-artifactarium"]
# auto-artifactarium = { path = "../auto-artifactarium" }
