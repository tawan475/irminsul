name: Create Release
# Press "Run workflow" on main. The version is not typed: next_version.py takes
# the base from Cargo.toml and appends the next -T-N from the existing tags
# (v0.2.2-T-1, v0.2.2-T-2 -> 0.2.2-T-3; bumping Cargo.toml to 0.2.3 -> 0.2.3-T-1).
# Nothing is committed to main (it's protected): the version is set only in the
# build, and the release tag points at the commit that was built.
on:
  workflow_dispatch:

# TRACKER_API_URL is deliberately NOT set at workflow level: option_env! in
# src/app.rs yields Some("") for a set-but-empty variable, which would bake an
# unusable empty base URL into the released binary with no way for a user to
# fix it. The "Export tracker API URL" step below sets it only when the
# repository variable actually has a value.

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags decide the next -T-N
      - id: next
        run: python3 next_version.py --github-output >> "$GITHUB_OUTPUT"
      - run: echo "Releasing v${{ steps.next.outputs.version }}"

  build:
    needs: [version]
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            binary: irminsul.exe
            features: ""
            out_file: irminsul-windows.exe
          - os: windows-latest
            name: windows-pcap
            binary: irminsul.exe
            features: "pcap"
            out_file: irminsul-windows-pcap.exe
          - os: ubuntu-22.04
            name: linux-x86_64
            binary: irminsul
            features: "pcap,static-libpcap"
            out_file: irminsul-linux-x86_64.tar.gz
          - os: macos-latest
            name: macos-arm64
            binary: irminsul
            features: "pcap"
            out_file: Irminsul-macos-arm64.app.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Export tracker API URL
        if: vars.TRACKER_API_URL != ''
        shell: bash
        run: echo "TRACKER_API_URL=${{ vars.TRACKER_API_URL }}" >> "$GITHUB_ENV"
      - run: cargo install toml-cli
      - name: Update Cargo.toml version locally
        shell: bash
        run: |
          toml set Cargo.toml package.version ${{ needs.version.outputs.version }} > Cargo.toml.new
          rm Cargo.toml
          mv Cargo.toml.new Cargo.toml
          # NEVER `cargo generate-lockfile` here: it throws away every pin in the
          # committed Cargo.lock and re-resolves the whole graph at release time,
          # so the shipped binary would be built from a dependency set nothing
          # ever tested. `--workspace` only refreshes this package's own entry,
          # which is all the version bump above invalidates.
          cargo update --workspace
      - name: Setup Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure -f noninteractive man-db
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libappindicator3-dev libatk1.0-dev
      - name: Setup libpcap
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-libpcap
      - name: Setup Windows (for pcap builds)
        if: runner.os == 'Windows' && matrix.features == 'pcap'
        shell: pwsh
        run: |
          curl.exe -fsSL https://npcap.com/dist/npcap-sdk-1.15.zip -o sdk.zip
          $expected = '52c7b9fb4abee3ad9fe739bb545c3efe77b731c8e127122bdf328eafdae3ed4f'
          $actual = (Get-FileHash sdk.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "npcap SDK checksum mismatch: expected $expected, got $actual"
          }
          Expand-Archive -Path sdk.zip -DestinationPath . -Force
      # --locked: fail loudly if anything other than the version bump above
      # would change the lock, rather than silently shipping a different graph.
      - run: cargo build --release --locked --no-default-features --features "${{ matrix.features }}"
        env:
          LIB: ${{ github.workspace }}/Lib/x64/
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/release
          mv ${{ matrix.binary }} ${{ matrix.out_file }}
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd target/release
          strip ${{ matrix.binary }} 2>/dev/null || true
          chmod +x ${{ matrix.binary }} 2>/dev/null || true
          tar -czf ${{ matrix.out_file }} ${{ matrix.binary }}
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          version=${{ needs.version.outputs.version }}
          mkdir -p Irminsul.app/Contents/{MacOS,Resources}
          sed "s/APPVERSION/$version/g" macos/Info.plist > Irminsul.app/Contents/Info.plist
          cp macos/AppIcon.icns Irminsul.app/Contents/Resources/
          cp macos/launcher Irminsul.app/Contents/MacOS/
          cp target/release/irminsul Irminsul.app/Contents/MacOS/
          chmod +x Irminsul.app/Contents/MacOS/{launcher,irminsul}
          tar -czf target/release/${{ matrix.out_file }} Irminsul.app
      - uses: actions/upload-artifact@v4
        with:
          name: irminsul-${{ matrix.name }}
          path: target/release/${{ matrix.out_file }}

  create-release:
    runs-on: ubuntu-latest
    needs: [version, build]
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      # The action creates the tag on the commit this run built; main itself is
      # never pushed to, so branch protection needs no bypass.
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.version.outputs.version }}
          commit: ${{ github.sha }}
          name: "v${{ needs.version.outputs.version }}"
          artifacts: "artifacts/*/*"
